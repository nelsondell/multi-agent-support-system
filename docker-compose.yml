services:
  api:
    build: .
    ports:
      # Host port from API_PORT in .env, for machines where 8000 is already taken.
      - "${API_PORT:-8000}:8000"
    # Every setting is documented in .env.example; `cp .env.example .env` is the whole setup.
    env_file: .env
    volumes:
      # Built by the container on first boot from the committed corpus snapshot, reused after.
      # Read-write because Chroma opens its SQLite store read-write even to serve queries.
      - index:/app/data/processed
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 3
      # Covers the first boot, which builds the index before the API starts listening.
      start_period: 120s
    restart: unless-stopped

volumes:
  index:
