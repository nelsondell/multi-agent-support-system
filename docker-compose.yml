# One node by default: `docker compose up` runs `api` over SQLite files in its own volumes.
# `make scale` runs the `scale` profile instead: Postgres, two replicas over it and a round-robin
# load balancer on SCALE_PORT. `make observe` adds the `observability` profile to the one node:
# Prometheus with the alert rules, Grafana with the dashboard, and Jaeger for the traces
# (docs/operations.md).

# The identity provider's public keys, from `make dev-keys`. Only the public half is mounted, and
# compose stops with an error if it is missing rather than create an empty directory.
x-jwks: &jwks
  type: bind
  source: ./.dev/jwks.json
  target: /app/.dev/jwks.json
  read_only: true
  bind:
    create_host_path: false

x-api: &api
  build: .
  # One image for every service that runs the API, so it is built once.
  image: multi-agent-support-system:local
  # Every setting is documented in .env.example; `cp .env.example .env` is the whole setup.
  env_file: .env
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).status == 200 else 1)"
    interval: 10s
    timeout: 3s
    retries: 3
    # Covers the first boot, which builds the index before the API starts listening.
    start_period: 120s
  # Longer than uvicorn's own graceful shutdown (30 s), so in-flight turns can finish.
  stop_grace_period: 40s
  restart: unless-stopped

x-replica: &replica
  <<: *api
  profiles: [scale]
  environment:
    STORAGE: postgres
    DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres
    AUTH_JWKS_URL: ${AUTH_JWKS_URL:-.dev/jwks.json}
  depends_on:
    postgres:
      condition: service_healthy

services:
  api:
    <<: *api
    environment:
      # The public keys compose mounts below, unless .env names another provider.
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-.dev/jwks.json}
      # Set by `make observe` to Jaeger's OTLP endpoint; empty, spans go nowhere.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      # Host port from API_PORT in .env, for machines where 8000 is already taken.
      - "${API_PORT:-8000}:8000"
    volumes:
      # The index: built on first boot from the committed corpus snapshot, reused after. Read-write
      # because Chroma opens its SQLite store read-write even to serve queries.
      - index:/app/data/processed
      # The conversation checkpoints. A volume of their own, so dropping the index to rebuild it
      # never deletes a conversation.
      - state:/app/data/state
      - *jwks

  # --- scale profile ---------------------------------------------------------------------------
  postgres:
    profiles: [scale]
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Each replica builds and keeps its own copy of the read-only index; everything that outlives a
  # request (checkpoints, cases, turn locks) is in Postgres.
  api-a:
    <<: *replica
    volumes:
      - index-a:/app/data/processed
      - *jwks

  api-b:
    <<: *replica
    volumes:
      - index-b:/app/data/processed
      - *jwks

  lb:
    profiles: [scale]
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    ports:
      - "${SCALE_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-a:
        condition: service_healthy
      api-b:
        condition: service_healthy

  # --- observability profile -------------------------------------------------------------------
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

  jaeger:
    profiles: [observability]
    image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    ports:
      - "${JAEGER_PORT:-16686}:16686"

volumes:
  index:
  state:
  postgres:
  index-a:
  index-b:
