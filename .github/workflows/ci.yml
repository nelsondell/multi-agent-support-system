name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    services:
      postgres:
        # Service containers run on Linux only; an empty image skips it on macOS.
        image: ${{ matrix.os == 'ubuntu-24.04' && 'postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Sync from the lockfile, the only step allowed the network
        run: uv sync --frozen
      # On Linux a fresh network namespace has no route out; macOS has none, so there the tests'
      # blocked sockets are the guard.
      - name: Verify offline
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo -E unshare --net -- sudo -E -u "$USER" env "PATH=$PATH" make verify-offline
          else
            make verify-offline
          fi
      # A skipped replica test would be a silent pass, so a skip fails the step.
      - name: Two replicas over one Postgres
        if: runner.os == 'Linux'
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        shell: bash
        run: |
          uv run --frozen pytest -q -rs tests/test_replicas.py | tee replicas.txt
          ! grep -q skipped replicas.txt
      - name: Secret scan (reviewed false positives are in .gitleaksignore)
        if: runner.os == 'Linux'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-${{ matrix.os }}
          path: reports/verify.md

  container:
    name: Container, supply chain and scale
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      # The documented setup with no key: the fake model, the local embedder and the retrieval
      # floor that goes with it, plus a throwaway key pair standing in for the identity provider.
      - name: Keyless configuration and a merchant token
        run: |
          cp .env.example .env
          sed -i -e 's/^LLM_BACKEND=.*/LLM_BACKEND=fake/' -e 's/^EMBEDDING_BACKEND=.*/EMBEDDING_BACKEND=local/' \
            -e 's/^RETRIEVAL_CONFIDENCE_THRESHOLD=.*/RETRIEVAL_CONFIDENCE_THRESHOLD=0.35/' .env
          uv run --frozen python scripts/dev_auth.py keys
          echo "TOKEN=$(uv run --frozen python scripts/dev_auth.py token merchant cliente1988)" >> "$GITHUB_ENV"
      - name: Build
        run: |
          docker compose build
          echo "IMAGE=$(docker compose config --images | head -n 1)" >> "$GITHUB_ENV"
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json
      # Fails on any critical finding unless .trivyignore accepts it with a reason and an expiry.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
      # The fake router sends the question to the knowledge agent as written; this one clears the
      # local embedder's retrieval floor by a wide margin.
      - name: Smoke test one node
        run: |
          docker compose up -d --wait
          curl -fsS localhost:8000/health | jq -e '.status == "ok"'
          curl -fsS localhost:8000/metrics | grep -q '^# TYPE support_escalations_total counter'
          curl -fsS localhost:8000/chat -H 'Content-Type: application/json' -H "Authorization: Bearer $TOKEN" \
            -d '{"message": "What is the Get Smart card machine?"}' \
            | jq -e '.escalated == false and (.answer | length > 0) and (.sources | length > 0)'
      - name: Scale profile, one conversation across two replicas, then one replica killed
        run: |
          docker compose --profile scale up --build --wait lb
          curl -fsS localhost:8080/ready | jq -e '.status == "ready" and .storage == "postgres"'
          chat() {
            curl -fsS localhost:8080/chat -H 'Content-Type: application/json' -H "Authorization: Bearer $TOKEN" \
              -d '{"message": "What is the Get Smart card machine?", "conversation_id": "smoke"}' \
              | jq -e '.status == "answered"'
          }
          for _ in 1 2 3 4; do chat; done
          for replica in api-a api-b; do docker compose logs "$replica" | grep -q 'POST /chat'; done
          curl -fsS -H "Authorization: Bearer $TOKEN" localhost:8080/conversations/smoke \
            | jq -e '.messages | length == 8'
          docker compose kill api-a
          chat && chat
      - name: Logs
        if: always()
        run: docker compose --profile scale logs
