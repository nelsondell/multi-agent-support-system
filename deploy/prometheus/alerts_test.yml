# `promtool test rules alerts_test.yml`: each alert fires on the series that should trip it.
rule_files:
  - alerts.yml

evaluation_interval: 15s

tests:
  - interval: 15s
    input_series:
      - series: 'support_node_latency_seconds_bucket{node="router",le="8"}'
        values: "0+1x60"
      - series: 'support_node_latency_seconds_bucket{node="router",le="16"}'
        values: "0+10x60"
      - series: 'support_node_latency_seconds_bucket{node="router",le="+Inf"}'
        values: "0+10x60"
    alert_rule_test:
      - eval_time: 12m
        alertname: NodeLatencyP95High
        exp_alerts:
          - exp_labels: { severity: warning, node: router }
            exp_annotations:
              summary: "p95 of the router node is above 8 s"
              runbook: "Open that node's slowest traces in Jaeger: a slow `chat` span is the model vendor (check its status, or move LLM_MODEL), a slow `execute_tool` span is the tool's backend.\n"

  - interval: 15s
    input_series:
      - series: 'support_turns_total{intent="account_data",outcome="escalated"}'
        values: "0+3x60"
      - series: 'support_turns_total{intent="account_data",outcome="resolved"}'
        values: "0+1x60"
      - series: 'support_vendor_failures_total{vendor="model",kind="error"}'
        values: "0+2x60"
    alert_rule_test:
      - eval_time: 10m
        alertname: EscalationSpike
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "More than 40% of turns are going to a person"
              runbook: "Split support_escalations_total by reason: model_unavailable or tool_unavailable means a vendor or the account store is down (see VendorFailures); insufficient_sources or low_retrieval_confidence means questions the corpus does not answer.\n"
      - eval_time: 10m
        alertname: VendorFailures
        exp_alerts:
          - exp_labels: { severity: critical, vendor: model }
            exp_annotations:
              summary: "The model vendor keeps failing after retries"
              runbook: "Check the vendor's status page and the failing spans. Merchants are being escalated (model) or told the search is unavailable (web); nothing to restart, it clears when the vendor answers again.\n"

  - interval: 1m
    input_series:
      - series: "support_model_cost_usd_total"
        values: "0+0.05x120"
      - series: 'support_turns_total{intent="account_data",outcome="resolved"}'
        values: "0+1x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: CostPerResolutionHigh
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "A resolved turn costs more than USD 0.01 in model calls"
              runbook: "Compare cached with input tokens (support_model_tokens_total): a falling cache hit rate, or more escalations spreading the spend over fewer resolutions, raise the cost.\n"
