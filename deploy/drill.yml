# Compose override for scripts/drills/run.sh: the one-node API with a fault injected, short
# timeouts so a drill takes minutes, and spans sent to Jaeger. Keyless by default (fake model,
# local embedder); the web drill needs DRILL_LLM_BACKEND=openai and a key, since only a real model
# routes a question to the web. The drill runs as its own compose project, with its own volumes.
services:
  api:
    environment:
      FAULT_INJECTION: ${FAULT_INJECTION:-}
      LLM_BACKEND: ${DRILL_LLM_BACKEND:-fake}
      EMBEDDING_BACKEND: ${DRILL_EMBEDDING_BACKEND:-local}
      RETRIEVAL_CONFIDENCE_THRESHOLD: ${DRILL_RETRIEVAL_THRESHOLD:-0.35}
      LLM_CALL_TIMEOUT_S: "2"
      NODE_TIMEOUT_S: "10"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
