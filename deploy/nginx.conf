# The `scale` profile's load balancer: round robin over the two replicas. A replica that refuses
# the connection is skipped for 5 s and the request goes to the other one. A request already sent
# is never retried elsewhere, so a turn cannot run twice; the merchant's retry of a turn whose
# replica died is finished from its checkpoint (app/main.py, take_turn).
upstream api {
    server api-a:8000 max_fails=1 fail_timeout=5s;
    server api-b:8000 max_fails=1 fail_timeout=5s;
}

server {
    listen 8080;

    location / {
        proxy_pass http://api;
        proxy_next_upstream error timeout;
        proxy_connect_timeout 2s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
